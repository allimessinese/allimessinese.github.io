- title: "Capacitive Biosensor for Detection of GHB"
  year: 2022
  number: "P133763NL00"
  status: "Filed"
  description: "A capacitive biosensor for rapid, passive, in-situ detection of gamma-hydroxybutyric acid (GHB) in drinks. The device uses the BlcR transcription factor immobilised on a gold interdigitated electrode: GHB binding causes BlcR to release from the DNA, changing electrode capacitance and triggering an LED warning. Priority filing September 30, 2022. iGEM TU Delft 2022 (SPYKE)."
  link: "https://2022.igem.wiki/tudelft/entrepreneurship"
  pdf: "/assets/ghb-patent.pdf"
  pdf_figures: "/assets/ghb-patent-figures.pdf"
