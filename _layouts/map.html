<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects · {{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,800;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="{{ '/assets/css/map.css' | relative_url }}">
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="{{ '/' | relative_url }}">A.M.</a>
      <ul class="nav-links">
        <li><a href="{{ '/about/' | relative_url }}">About</a></li>
        <li><a href="{{ '/projects/' | relative_url }}" class="active">Projects</a></li>
        <li><a href="{{ '/publications/' | relative_url }}">Publications &amp; Recognition</a></li>
        <li><a href="{{ '/patents/' | relative_url }}">Patents</a></li>
      </ul>
    </div>
  </nav>

  <div class="map-wrapper">
    <div id="world-map"></div>

    <button class="recenter-btn" id="recenter-btn">⊙ &nbsp;World view</button>
    <div class="map-hint" id="map-hint">Click a dot to explore</div>
    <div class="map-legend" id="map-legend"></div>

    <aside class="city-panel" id="city-panel">
      <div class="panel-header">
        <div>
          <div class="panel-city" id="panel-city-name">—</div>
          <div class="panel-count" id="panel-count"></div>
        </div>
        <button class="panel-close" id="panel-close" aria-label="Close">✕</button>
      </div>
      <div class="panel-projects" id="panel-projects"></div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  {{ content }}
</body>
</html>
